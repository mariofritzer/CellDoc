; CellDoc – ESP32-Akkuprüfstand
; esp32dev = großer Prüfstand (2 Anschlüsse, bis 6S, 30 W)
; mini1 / mini2 / mini4 = CellDoc Mini für 18650 mit 1, 2 oder 4 Schächten
[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.9.0
framework = arduino
board = esp32dev
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
extra_scripts = pre:tools/embed_web.py
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  paulstoffregen/OneWire@^2.3.7
  milesburton/DallasTemperature@^3.9.0
  knolleary/PubSubClient@^2.8
build_flags =
  -DCORE_DEBUG_LEVEL=1

[env:esp32dev]
build_src_filter = +<*> -<mini/>

[mini]
build_src_filter = -<*> +<settings.cpp> +<storage.cpp> +<cells.cpp> +<web.cpp> +<web_data.cpp> +<mqtt.cpp> +<mini/>
lib_deps =
  ${env.lib_deps}
  olikraus/U8g2@^2.35.9

[env:mini1]
build_src_filter = ${mini.build_src_filter}
lib_deps = ${mini.lib_deps}
build_flags = ${env.build_flags} -DCELLDOC_MINI -DSLOTS=1

[env:mini2]
build_src_filter = ${mini.build_src_filter}
lib_deps = ${mini.lib_deps}
build_flags = ${env.build_flags} -DCELLDOC_MINI -DSLOTS=2

[env:mini4]
build_src_filter = ${mini.build_src_filter}
lib_deps = ${mini.lib_deps}
build_flags = ${env.build_flags} -DCELLDOC_MINI -DSLOTS=4
