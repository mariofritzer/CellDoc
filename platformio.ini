; CellDoc – ESP32-Akkuprüfstand
; esp32dev = großer Prüfstand (2 Anschlüsse, bis 6S, 30 W)
; mini1 / mini2 / mini4 = CellDoc Mini für 18650 mit 1, 2 oder 4 Schächten
; nano = CellDoc Nano (ESP32-C3 SuperMini, ein Schacht, fester Lastwiderstand)
[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.9.0
framework = arduino
board = esp32dev
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts = pre:tools/embed_web.py
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  paulstoffregen/OneWire@^2.3.7
  milesburton/DallasTemperature@^3.9.0
  knolleary/PubSubClient@^2.8
  olikraus/U8g2@^2.35.9
build_flags =
  -DCORE_DEBUG_LEVEL=1

[env:esp32dev]
build_src_filter = +<*> -<mini/>

[mini]
build_src_filter = -<*> +<settings.cpp> +<storage.cpp> +<cells.cpp> +<web.cpp> +<web_data.cpp> +<mqtt.cpp> +<scanner.cpp> +<sync.cpp> +<improv.cpp> +<mini/>
lib_deps =
  ${env.lib_deps}

[env:mini1]
build_src_filter = ${mini.build_src_filter}
lib_deps = ${mini.lib_deps}
build_flags = ${env.build_flags} -DCELLDOC_MINI -DSLOTS=1

[env:mini2]
build_src_filter = ${mini.build_src_filter}
lib_deps = ${mini.lib_deps}
build_flags = ${env.build_flags} -DCELLDOC_MINI -DSLOTS=2

[env:mini4]
build_src_filter = ${mini.build_src_filter}
lib_deps = ${mini.lib_deps}
build_flags = ${env.build_flags} -DCELLDOC_MINI -DSLOTS=4

; ---------------------------------------------------------------- ESP32-S3 (DevKitC-1, N16R8)
[s3]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_s3.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
s3_flags = -DBOARD_HAS_PSRAM

[env:esp32s3]
board = ${s3.board}
board_build.partitions = ${s3.board_build.partitions}
board_build.flash_size = ${s3.board_build.flash_size}
board_upload.flash_size = ${s3.board_upload.flash_size}
board_build.arduino.memory_type = ${s3.board_build.arduino.memory_type}
build_src_filter = +<*> -<mini/>
build_flags = ${env.build_flags} ${s3.s3_flags}

[env:mini1-s3]
board = ${s3.board}
board_build.partitions = ${s3.board_build.partitions}
board_build.flash_size = ${s3.board_build.flash_size}
board_upload.flash_size = ${s3.board_upload.flash_size}
board_build.arduino.memory_type = ${s3.board_build.arduino.memory_type}
build_src_filter = ${mini.build_src_filter}
lib_deps = ${mini.lib_deps}
build_flags = ${env.build_flags} ${s3.s3_flags} -DCELLDOC_MINI -DSLOTS=1

[env:mini2-s3]
board = ${s3.board}
board_build.partitions = ${s3.board_build.partitions}
board_build.flash_size = ${s3.board_build.flash_size}
board_upload.flash_size = ${s3.board_upload.flash_size}
board_build.arduino.memory_type = ${s3.board_build.arduino.memory_type}
build_src_filter = ${mini.build_src_filter}
lib_deps = ${mini.lib_deps}
build_flags = ${env.build_flags} ${s3.s3_flags} -DCELLDOC_MINI -DSLOTS=2

[env:mini4-s3]
board = ${s3.board}
board_build.partitions = ${s3.board_build.partitions}
board_build.flash_size = ${s3.board_build.flash_size}
board_upload.flash_size = ${s3.board_upload.flash_size}
board_build.arduino.memory_type = ${s3.board_build.arduino.memory_type}
build_src_filter = ${mini.build_src_filter}
lib_deps = ${mini.lib_deps}
build_flags = ${env.build_flags} ${s3.s3_flags} -DCELLDOC_MINI -DSLOTS=4

; ---------------------------------------------------------------- CellDoc Nano (ESP32-C3 SuperMini, 4 MB)
[env:nano]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_src_filter = ${mini.build_src_filter}
lib_deps = ${mini.lib_deps}
build_flags = ${env.build_flags} -DCELLDOC_MINI -DCELLDOC_NANO -DSLOTS=1 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
