name: Firmware bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lebenszahl-Tests (PC)
        run: g++ -std=c++17 -Wall -Werror -I src test/test_soh.cpp -o test_soh && ./test_soh

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {env: esp32dev, name: celldoc, chip: esp32, boot: "0x1000", max: 1572864}
          - {env: mini1, name: celldoc-mini1, chip: esp32, boot: "0x1000", max: 1572864}
          - {env: mini2, name: celldoc-mini2, chip: esp32, boot: "0x1000", max: 1572864}
          - {env: mini4, name: celldoc-mini4, chip: esp32, boot: "0x1000", max: 1572864}
          - {env: esp32s3, name: celldoc-s3, chip: esp32s3, boot: "0x0", max: 3145728}
          - {env: mini1-s3, name: celldoc-mini1-s3, chip: esp32s3, boot: "0x0", max: 3145728}
          - {env: mini2-s3, name: celldoc-mini2-s3, chip: esp32s3, boot: "0x0", max: 3145728}
          - {env: mini4-s3, name: celldoc-mini4-s3, chip: esp32s3, boot: "0x0", max: 3145728}
          - {env: nano, name: celldoc-nano, chip: esp32c3, boot: "0x0", max: 1572864}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}

      - name: PlatformIO installieren
        run: pip install platformio

      - name: Version festlegen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "CELLDOC_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "CELLDOC_VERSION=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Bauen
        run: |
          set -o pipefail
          pio run -e ${{ matrix.env }} 2>&1 | tee build.log

      - name: Fehler als Hinweise ausgeben
        if: failure()
        run: |
          grep -E "error:|Error |undefined reference" build.log | head -10 | while IFS= read -r l; do
            echo "::error::${l:0:300}"
          done

      - name: Dateien zusammenstellen
        run: |
          B=.pio/build/${{ matrix.env }}
          mkdir -p out
          cp $B/firmware.bin out/${{ matrix.name }}-firmware.bin
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          pio pkg exec -p tool-esptoolpy -- esptool.py --chip ${{ matrix.chip }} merge_bin -o out/${{ matrix.name }}-factory.bin \
            ${{ matrix.boot }} $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
          SIZE=$(stat -c%s out/${{ matrix.name }}-firmware.bin)
          echo "::notice::${{ matrix.env }}: $SIZE von ${{ matrix.max }} Bytes"
          test "$SIZE" -lt $(( ${{ matrix.max }} - 8192 ))

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*.bin

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Vorabversion „latest“ aktualisieren
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Neuester Stand (main)
          prerelease: true
          make_latest: false
          body: |
            Automatisch gebaut aus dem aktuellen Stand von `main`.

            | Gerät | Update über die Weboberfläche | Erstinstallation per USB (Adresse 0x0) |
            |---|---|---|
            | CellDoc | celldoc-firmware.bin | celldoc-factory.bin |
            | CellDoc Mini 1 | celldoc-mini1-firmware.bin | celldoc-mini1-factory.bin |
            | CellDoc Mini 2 | celldoc-mini2-firmware.bin | celldoc-mini2-factory.bin |
            | CellDoc Mini 4 | celldoc-mini4-firmware.bin | celldoc-mini4-factory.bin |
            | CellDoc · ESP32-S3 | celldoc-s3-firmware.bin | celldoc-s3-factory.bin |
            | CellDoc Mini 1 · ESP32-S3 | celldoc-mini1-s3-firmware.bin | celldoc-mini1-s3-factory.bin |
            | CellDoc Mini 2 · ESP32-S3 | celldoc-mini2-s3-firmware.bin | celldoc-mini2-s3-factory.bin |
            | CellDoc Mini 4 · ESP32-S3 | celldoc-mini4-s3-firmware.bin | celldoc-mini4-s3-factory.bin |
            | CellDoc Nano (ESP32-C3) | celldoc-nano-firmware.bin | celldoc-nano-factory.bin |

            Der Webflasher erkennt ESP32 und ESP32-S3 selbst und spielt die passende Datei auf.
          files: out/*.bin

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.bin
          generate_release_notes: true

  # GitHub Pages: Weboberfläche im Demo-Modus + Webflasher unter /flash/
  demo:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: fw
          merge-multiple: true

      - name: Seite zusammenstellen
        run: |
          mkdir -p site/flash
          cp web/index.html site/index.html
          cp -r web/vendor site/vendor
          cp web/flash/index.html site/flash/index.html
          VER="dev-$(git rev-parse --short HEAD) · $(date -u +%Y-%m-%d)"
          for id in celldoc celldoc-mini1 celldoc-mini2 celldoc-mini4; do
            case $id in
              celldoc) title="CellDoc" ;;
              celldoc-mini1) title="CellDoc Mini 1" ;;
              celldoc-mini2) title="CellDoc Mini 2" ;;
              celldoc-mini4) title="CellDoc Mini 4" ;;
            esac
            cp fw/$id-factory.bin fw/$id-s3-factory.bin site/flash/
            cat > site/flash/manifest-$id.json <<EOF
          {
            "name": "$title",
            "version": "$VER",
            "new_install_prompt_erase": true,
            "builds": [
              { "chipFamily": "ESP32", "parts": [ { "path": "$id-factory.bin", "offset": 0 } ] },
              { "chipFamily": "ESP32-S3", "parts": [ { "path": "$id-s3-factory.bin", "offset": 0 } ] }
            ]
          }
          EOF
          done
          cp fw/celldoc-nano-factory.bin site/flash/
          cat > site/flash/manifest-celldoc-nano.json <<EOF
          {
            "name": "CellDoc Nano",
            "version": "$VER",
            "new_install_prompt_erase": true,
            "builds": [
              { "chipFamily": "ESP32-C3", "parts": [ { "path": "celldoc-nano-factory.bin", "offset": 0 } ] }
            ]
          }
          EOF
          ls -la site/flash
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
